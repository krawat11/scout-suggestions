<style>
/* Layout: Property Finder listing page as-is (gallery, price, chips, agent / agency / Mortgage Finder sidebar).
   Only the "Property details" block is replaced by Scout's Suggestions. Single light look, like PF. */
:root{
  --bg:#ffffff; --fg:#2d2a3e; --muted:#6f6c80; --line:#ebe9f0; --soft:#f6f5f9; --chip:#f3f2f8;
  --brand:#ea3934; --navy:#28246a; --scout:#5a4ae3; --scout-2:#8b5cf6; --scout-soft:#f3f1ff;
  --good:#1e9e5a; --good-soft:#e5f6ec; --warn:#d98a00; --warn-soft:#fff4dd; --bad:#e0413b; --bad-soft:#fdecea;
  --font:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
a{color:inherit}
button{font:inherit}
.muted{color:var(--muted)} .small{font-size:13px} .note{font-size:12px;color:var(--muted)}
/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:28px;height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.pf{display:flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;border:0;background:none;padding:0}
.pf svg{width:26px;height:30px}
.pf span{color:var(--brand);font-weight:700;line-height:.95;font-size:15px;text-align:left}
.nav a{text-decoration:none;color:var(--fg);font-size:16px}
.nav .l{display:flex;gap:30px}.nav .r{display:flex;gap:30px;margin-left:auto;align-items:center}
.login{background:var(--brand);color:#fff!important;border-radius:99px;padding:10px 22px;font-weight:700}
.burger{font-size:22px}
@media (max-width:1000px){.nav .l,.nav .r a:not(.login):not(.burger){display:none}}
.page{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 80px}
.crumbs{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs .h{color:var(--navy)}
.backbtn{border:1px solid var(--navy);background:var(--bg);color:var(--navy);border-radius:99px;padding:5px 14px;font-weight:700;font-size:14px;cursor:pointer;margin-right:6px} .crumbs b{font-weight:400;color:var(--fg)}
.crumbs .acts2{margin-left:auto;display:flex;gap:24px;color:var(--navy);font-weight:700;font-size:15px}
.crumbs .acts2 span{display:flex;gap:6px;align-items:center}
@media (max-width:700px){.crumbs .acts2{display:none}.crumbs .mid{display:none}}
/* gallery */
.gallery{display:grid;grid-template-columns:1.62fr 1fr;gap:12px;margin-top:22px;aspect-ratio:1670/652;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;border-radius:14px;background:var(--soft)}
.gallery{grid-template-rows:minmax(0,1fr)}
.gallery .main{position:relative;min-height:0;height:100%}
.gallery .side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px;min-height:0;height:100%}
.gallery .side img{min-height:0}
.gallery .count{position:absolute;right:14px;bottom:14px;background:rgba(30,28,40,.72);color:#fff;font-size:14px;border-radius:8px;padding:3px 10px;display:flex;gap:6px;align-items:center}
@media (max-width:700px){.gallery{grid-template-columns:1fr;aspect-ratio:668/452}.gallery .side{display:none}}
/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin-top:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.price{font-size:clamp(28px,4vw,38px);font-weight:900;margin:6px 0 10px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.dh{width:.85em;height:.85em}
.chips{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:22px;border-bottom:3px solid var(--line)}
.chips span{display:flex;gap:8px;align-items:center;background:var(--chip);color:var(--navy);border-radius:8px;padding:9px 14px;font-size:15px;font-weight:700}
.chips svg{width:18px;height:18px;flex:none}
@media (max-width:700px){.chips{flex-wrap:nowrap;overflow-x:auto}.chips span{white-space:nowrap}}
.below{border-top:3px solid var(--line);margin-top:28px;padding-top:24px}
.below .sub{font-size:14px;color:var(--muted);font-weight:700}
.below h2{font-size:26px;margin:6px 0 10px;font-weight:700;text-wrap:balance}
.avail{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:14px}
.desc{white-space:pre-line;color:#5b5868}
/* sidebar */
.side-wrap{background:var(--soft);border-radius:24px;padding:20px;display:grid;gap:22px;position:sticky;top:84px}
@media (max-width:900px){.side-wrap{position:static}}
.box{background:var(--bg);border-radius:16px;box-shadow:0 1px 4px rgba(30,20,80,.10);padding:18px}
.agent{display:grid;grid-template-columns:124px 1fr;gap:18px;align-items:center}
.agent img{width:124px;height:124px;border-radius:50%;object-fit:cover;background:var(--soft)}
.agent h3{margin:0 0 4px;font-size:22px;font-weight:700}
.agent .meta{display:grid;gap:6px;font-size:15px}
.stars{display:flex;gap:4px;align-items:center;font-weight:700}
.stars u{font-weight:700}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ctas span{display:flex;justify-content:center;align-items:center;gap:8px;border:1px solid var(--navy);color:var(--navy);border-radius:8px;padding:12px;font-weight:700;font-size:18px}
.ctas .wa{background:var(--brand);border-color:var(--brand);color:#fff}
.broker{display:flex;gap:22px;align-items:center}
.broker img{width:160px;height:120px;object-fit:contain;border-radius:8px;background:#f6ece9;flex:none}
.broker b{font-size:22px;font-weight:700}
.mf{padding:0;overflow:hidden}
.mf .t{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.mf .lg{display:flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;line-height:.95;font-size:17px}
.mf .b{padding:18px 20px;display:grid;gap:12px}
.mf h4{margin:0;font-size:19px}
.mf ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.mf li{display:flex;gap:12px;align-items:center}
.mf li::before{content:"✓";color:var(--brand);font-weight:900}
.mf .btn{border:1px solid var(--navy);color:var(--navy);text-align:center;border-radius:10px;padding:12px;font-weight:700;font-size:18px}
@media (max-width:420px){.agent{grid-template-columns:84px 1fr}.agent img{width:84px;height:84px}.broker img{width:100px;height:76px}}

/* ===== Scout's Suggestions (replaces Property details) ===== */
.scout{margin-top:26px;display:grid;gap:12px}
.scout-h{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--scout),var(--scout-2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(90,74,227,.30)}
.av svg{width:20px;height:20px}
.scout-h b{display:block;font-size:20px}
.bubble{background:var(--scout-soft);border-radius:6px 20px 20px 20px;padding:16px 18px;display:grid;gap:12px;max-width:100%}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.facts div{font-weight:700}
.facts div b{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.trust{display:flex;gap:22px;align-items:center}
.trust .txt{flex:1;min-width:0;display:grid;gap:10px;text-align:left}
.trust .gauge{flex:none;width:250px}
@media (max-width:560px){.trust{flex-direction:column-reverse;align-items:stretch}.trust .gauge{width:100%;max-width:260px;margin:0 auto}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:900;width:fit-content;letter-spacing:.02em}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:#a86400} .pill.good{background:var(--good-soft);color:var(--good)}
.verdict{font-size:17px;font-weight:700;line-height:1.35}
.flags{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.flags li{display:flex;gap:8px;align-items:flex-start}
.flags li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:8px;background:var(--bad)}
.flags li.done{text-decoration:line-through;opacity:.55}
.flags li.done::before{background:var(--good)}
.okline{font-size:14px;color:#2a6d47}
.howlink{background:none;border:0;color:var(--scout);font-weight:900;padding:0;cursor:pointer;text-align:left;width:fit-content}
table.ded{width:100%;border-collapse:collapse;font-size:14px}
table.ded td{padding:6px 0;border-bottom:1px solid #e2dff3;vertical-align:top} table.ded td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:900;padding-left:10px;white-space:nowrap}
.gauge svg{width:100%;height:auto;display:block;overflow:hidden}
.trust .gauge{align-self:center}
.gauge .needle{transition:transform 1.4s cubic-bezier(.2,.9,.25,1.15);transform-box:view-box;transform-origin:120px 118px}
.gauge .g-num{font-size:34px;font-weight:900;fill:var(--fg);font-family:var(--font)}
.gauge .g-lbl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.12em;font-family:var(--font)}
.gauge .tick-l{font-size:10px;fill:#9895aa;font-family:var(--font);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{border:1.5px solid var(--scout);background:var(--bg);color:var(--scout);border-radius:99px;padding:8px 14px;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;transition:background .15s}
.act:hover{background:#ece9ff}
.act.primary{background:linear-gradient(135deg,var(--scout),var(--scout-2));color:#fff;border-color:transparent}
.act:focus-visible,.card:focus-visible,button:focus-visible{outline:3px solid var(--scout);outline-offset:2px}
/* home */
.intro{background:var(--scout-soft);border-radius:16px;padding:16px 18px;margin-top:8px;max-width:760px}
.seg{display:flex;gap:8px;margin:20px 0 8px;max-width:420px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:99px;padding:10px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:12px}
.card{display:block;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;background:var(--bg);color:inherit;text-align:left;width:100%;padding:0}
.card img{width:100%;aspect-ratio:668/452;object-fit:cover;display:block;background:var(--soft)}
.card .body{padding:12px 14px 14px;display:grid;gap:4px}
.card .cp{font-weight:900;font-size:20px}
/* chat sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,30,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(20,10,60,.2)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h>button{margin-left:auto;border:0;background:var(--soft);color:var(--fg);border-radius:99px;width:32px;height:32px;cursor:pointer}
.log{overflow-y:auto;padding:12px 16px;display:grid;gap:10px;align-content:start;flex:1}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:15px;display:grid;gap:6px}
.msg.s{background:var(--scout-soft);border-top-left-radius:4px}
.msg.u{background:var(--navy);color:#fff;justify-self:end;border-top-right-radius:4px}
.msg.a{background:var(--soft);border:1px dashed var(--muted);border-top-left-radius:4px}
.msg .who{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.msg.u .who{color:inherit;opacity:.75}
.draft{border:1px solid var(--scout);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.draft textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14.5px;background:var(--bg);color:var(--fg);resize:vertical}
.draft .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.send{background:var(--scout);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.send:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer}
.compose{display:flex;gap:6px;padding:10px 16px 12px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--fg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp img{width:100%;aspect-ratio:668/452;object-fit:cover;border-radius:8px;background:var(--soft)}
.tx{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tx td{padding:3px 0;border-bottom:1px solid var(--line)} .tx td:last-child{text-align:right}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slots button{border:1px solid var(--scout);background:var(--bg);color:var(--scout);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700}
.slots button[aria-pressed="true"]{background:var(--scout);color:#fff}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.4}}}
@media (prefers-reduced-motion:reduce){.gauge .needle{transition:none}}
</style>

const GC={x:120,y:118,r:94};

function gauge(id){
  const s=state.scores[id]; const from=state.shown[id]??0; const [c,t]=band(s);

  for(const v of [0,50,85,100]){const [x0,y0]=pt(v,GC.r-14);const [x1,y1]=pt(v,GC.r-21);ticks+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#bdb8d6" stroke-width="2" stroke-linecap="round"/>`}
  const labels=[0,50,85,100].map(v=>{const [x,y]=pt(v,GC.r-35);return `<text class="tick-l" x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle">${v}</text>`}).join("");
  return `<div class="gauge" role="img" aria-label="Trust score ${s} out of 100, ${t}">

    </defs>

    <path d="${arc(0,50,GC.r)}" stroke="url(#gR)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="${arc(51.5,83.5,GC.r)}" stroke="url(#gA)" stroke-width="13" fill="none"/>
    <path d="${arc(85,100,GC.r)}" stroke="url(#gG)" stroke-width="13" fill="none" stroke-linecap="round"/>
    ${ticks}${labels}
    <g class="needle" data-to="${ang(s)}" style="transform:rotate(${ang(from)}deg)">
      <path d="M${GC.x} ${GC.y-3} L${GC.x+GC.r-34} ${GC.y} L${GC.x} ${GC.y+3} Z" fill="${col}" stroke="${col}" stroke-width="1" stroke-linejoin="round"/>

  else if(/(bill|dewa|chiller|wifi|wi-fi)/.test(s)){r=id==="163244904"?"The listing says DEWA, chiller and Wi-Fi are included, but only if you rent for less than a year. For a 12-month stay that's unclear, so it's worth asking.":"The listing doesn't say. In Dubai, tenants usually pay DEWA and chiller on top of rent."}
  else if(/(cheque|payment)/.test(s)){r=id==="163244904"?"The listing says 4 cheques.":"The listing doesn't say how many cheques. I can ask."}
  else if(/(permit|legit|real|scam|fake|trust)/.test(s)){r=`Score ${state.scores[id]}/100. ${l.verdict} Tap "How I scored it" on the page for each check.`}
  if(r){scoutMsg(esc(r));return}
  scoutMsg(`Only ${esc(l.agent.first)} would know that.`);
  draft(id,`Hi ${l.agent.first}, a question about this unit: ${q}`,null);
}

function route(){
  const h=location.hash.slice(1);
  if(h.startsWith("l")&&L[h.slice(1)]){state.mode=L[h.slice(1)].mode;listing(h.slice(1))}else home();
}
window.addEventListener("hashchange",()=>{document.getElementById("sheetRoot").innerHTML="";route();window.scrollTo(0,0)});
route();
</script>
